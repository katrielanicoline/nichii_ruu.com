<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Moon & Stars</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background-image: url(./images/svg\ background.png);
  
  background-size: cover;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

svg {
  width: 100%;
  height: 100%;
}

.moon {
  fill: #f8fafc;
  filter: drop-shadow(0 0 30px rgba(255,255,255,0.6));
}

.star {
  fill: #fde68a;
  cursor: pointer;
  transition: fill 0.4s ease;
  transform-origin: center;
}
.back-container {
      position: absolute;
      bottom: 15px;
      left: 500px;
      width: 100%;
      text-align: center;
      z-index: 300;
    }

    .back-button {
      width: 160px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .back-button:hover {
      transform: scale(1.05);
    }
</style>
</head>

<body>

<svg viewBox="0 0 800 600">

  <circle cx="400" cy="300" r="90" class="moon"/>

  <polygon class="star" data-x="400" data-y="105"
    points="400,70 410,95 435,105 410,115 400,140 390,115 365,105 390,95"/>

  <polygon class="star" data-x="600" data-y="215"
    points="600,180 610,205 635,215 610,225 600,250 590,225 565,215 590,205"/>

  <polygon class="star" data-x="200" data-y="215"
    points="200,180 210,205 235,215 210,225 200,250 190,225 165,215 190,205"/>

  <polygon class="star" data-x="260" data-y="455"
    points="260,420 270,445 295,455 270,465 260,490 250,465 225,455 250,445"/>

  <polygon class="star" data-x="540" data-y="455"
    points="540,420 550,445 575,455 550,465 540,490 530,465 505,455 530,445"/>

</svg>

<div class="back-container">
      <a href="Portofolio.html">
        <img src="./images/back button.png" alt="Back" class="back-button">
      </a>
    </div>
<script>
const stars = document.querySelectorAll('.star');

stars.forEach(star => {
  star.state = {
    offsetX: 0,
    offsetY: 0,
    targetX: 0,
    targetY: 0
  };
});

function animate() {
  stars.forEach((star, i) => {
    star.state.offsetX += (star.state.targetX - star.state.offsetX) * 0.05;
    star.state.offsetY += (star.state.targetY - star.state.offsetY) * 0.05;

    const swayX = Math.sin(Date.now() / 1400 + i) * 10;
    const swayY = Math.cos(Date.now() / 1400 + i) * 10;

    star.setAttribute(
      'transform',
      `translate(${star.state.offsetX + swayX}, ${star.state.offsetY + swayY})`
    );
  });

  requestAnimationFrame(animate);
}
animate();

stars.forEach(star => {
  star.addEventListener('click', () => {
    
    star.state.targetX += (Math.random() - 0.5) * 55;
    star.state.targetY += (Math.random() - 0.5) * 55;

   
    const colors = ['#38bdf8', '#f472b6', '#a78bfa', '#22c55e', '#fde68a'];
    star.style.fill = colors[Math.floor(Math.random() * colors.length)];
  });
});
</script>


</body>
</html>
