<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background-image: url(./images/misc\ background.png);
    
    background-size: cover;
  }

  .gallery-container {
    display: flex;
    height: 720px;
    gap: 10px;
    padding: 10px;
    margin-top: 300px;
    margin-bottom: 40px;
    margin-left: 40px;
    margin-right: 40px;
    box-sizing: border-box;
  }

  /* Left side using Flexbox */
  .left-gallery {
    flex: 1; 
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .left-gallery img {
    flex: 1;
    width: 100%;
    object-fit: cover;
    border-radius: 8px;
  }

  /* Right side using Grid */
  .right-gallery {
    flex: 2; 
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 1fr;
    gap: 10px;
  }

  .right-gallery img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
  }

  .right-gallery img:nth-child(1) {
    grid-column: 1 / 3;
    grid-row: 1 / 2;
  }

  .right-gallery img:nth-child(2) {
    grid-column: 1 / 2;
    grid-row: 2 / 3;
  }

  .right-gallery img:nth-child(3) {
    grid-column: 2 / 3;
    grid-row: 2 / 4;
  }

  .right-gallery img:nth-child(4) {
    grid-column: 1 / 2;
    grid-row: 3 / 4;
  }

  .right-gallery img:nth-child(5) {
    grid-column: 2 / 3;
    grid-row: 5 / 6;
  }

  .right-gallery img:nth-child(6) {
    grid-column: 1 / 3;
    grid-row: 4 / 5; 
  }
   .back-container {
      position: absolute;
      bottom: -1700px;
      left: -420px;
      width: 100%;
      text-align: center;
      z-index: 300;
    }

    .back-button {
      width: 160px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .back-button:hover {
      transform: scale(1.05);
    }

      .decor {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 20; 
  pointer-events: none;
}

.decor img {
  width: 1550px;
  height: 2730px;
}
</style>
</head>
<body>
<div class="gallery-container">
    <!-- Left flexbox gallery with 3 images -->
    <div class="left-gallery">
      <img src="./images/Screenshot 2023-12-30 210252.png" alt="Left Image 1">
      <img src="./images/Screenshot 2023-12-30 210611.png" alt="Left Image 2">
      <img src="./images/Screenshot 2023-12-30 210332.png" alt="Left Image 3">
    </div>

    <!-- Right grid gallery -->
    <div class="right-gallery">
      <img src="./images/protect our ocean.jpg" alt="Grid Image 1">
      <img src="./images/wayang.png" alt="Grid Image 2">
      <img src="./images/Screenshot 2024-01-13 171804.png" alt="Grid Image 3">
      <img src="./images/CEC.png" alt="Grid Image 4">
      <img src="./images/brand building.png" alt="Grid Image 5">
      <img src="./images/WhatsApp Image 2024-11-13 at 11.37.26_1c470d30.jpg" alt="Grid Image 6">
      <img src="./images/Screenshot 2025-01-06 023332.png" alt="Grid Image 7">
    </div>
  </div>
 <div class="back-container">
      <a href="Portofolio.html">
        <img src="images/back button.png" alt="Back" class="back-button">
      </a>
    </div>


<div class="decor">
    
        <img src="images/misc decor.png">
      
    </div>
</body>
</html>
