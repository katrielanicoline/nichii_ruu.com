<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url(./images/game\ background.png);
            background-size: cover;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        .game-gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 30px;
        }

        .game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 100px;
        }

        .game img {
            width: 350px;
            height:200px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.3s, border 0.3s, border-radius 0.3s;
        }

        .game-title {
            font-weight: bold;
            color: #f7f1f1;
      font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      font-size: 20px;
        }

        .highlight {
            border: 5px solid rgb(78, 67, 112) !important;
        }

        .rounded {
            border-radius: 50% !important;
        }

        .back-container {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 300;
    }

    .back-button {
      width: 160px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .back-button:hover {
      transform: scale(1.05);
    }
    .decor {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 20; 
  pointer-events: none;
}

.decor img {
  width: 1550px;
  height: 720px;
}
    </style>
</head>
<body>

<div class="game-gallery">
    <div class="game" id="game1-container">
        <img id="game1-img1" src="./images/game 1.png" alt="Game 1">
        <div class="game-title">Cyberpunk Pursuit</div>
    </div>

    <div class="game" id="game2-container">
        <img id="game2-img1" src="./images/Game 2 (1).jpg" alt="Game 2 - Photo 1">
        <img id="game2-img2" src="./images/game 2 (2).jpg" alt="Game 2 - Photo 2">
        <div class="game-title">Healing Breeze</div>
    </div>

    <div class="game" id="game3-container">
        <img id="game3-img1" src="./images/game 3.jpg" alt="Game 3">
        <div class="game-title">Legend of the Leg Rowers</div>
    </div>
</div>
<div class="back-container">
      <a href="Portofolio.html">
        <img src="images/back button.png" alt="Back" class="back-button">
      </a>
    </div>

    
<div class="decor">
    
        <img src="images/game decor.png">
      
    </div>

<script>
    function highlightImage(evt) {
        document.querySelectorAll('.game-gallery img').forEach(img => {
            img.classList.remove('highlight');
        });
        evt.target.classList.add('highlight');
        console.log(`Clicked: ${evt.target.alt}`);
    }

    function roundImage(element) {
        element.classList.toggle('rounded');
    }

    document.getElementById('game1-img1').addEventListener('click', highlightImage);

    document.getElementById('game2-img1').addEventListener('click', () => roundImage(document.getElementById('game2-img1')));
    document.getElementById('game2-img2').addEventListener('click', () => roundImage(document.getElementById('game2-img2')));

    document.getElementById('game3-img1').addEventListener('click', highlightImage);
</script>

</body>
</html>
