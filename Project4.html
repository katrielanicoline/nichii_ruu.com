<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background-image: url(images/3d\ back.png);
      background-size: cover;
      background-repeat: no-repeat;
    }

    .portfolio {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(560px, 1fr));
      gap: 20px;
      margin-top: 160px;
      justify-items: center;
      box-sizing: border-box;
    }

    .card {
      position: relative;
      width: 640px;
      height: 360px;
      background-image: url(images/note\ 1.png);
      background-size: cover;
      background-repeat: no-repeat;
      padding: 20px;
      border-radius: 10px;
      overflow: hidden;
    }

    .card h3 {
      text-align: right;
      margin: 20px 20px 20px 0;
      font-size: 28px;
      color: aliceblue;
    }

    .container {
      width: 480px;
      height: 220px;
      margin: 10px auto;
      perspective: 900px;
      position: relative;
    }

    .flip-card {
      width: 140px;
      height: 150px;
      position: absolute;
      top: 35px;
      left: 0;
      transform-style: preserve-3d;
      animation: flip 6s ease-in-out forwards;
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
    }

    .front img,
    .back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back {
      transform: rotateY(180deg);
    }

    @keyframes flip {
      0% {
        transform-origin: right center;
        transform: rotateY(0deg);
      }
      25% {
        transform-origin: right center;
        transform: rotateY(180deg);
      }
      26% {
        transform-origin: left center;
        transform: translateX(280px) rotateY(180deg);
      }
      50% {
        transform-origin: left center;
        transform: translateX(280px) rotateY(360deg);
      }
      51% {
        transform-origin: right center;
        transform: translateX(280px) rotateY(360deg);
      }
      70% {
        transform-origin: right center;
        transform: translateX(280px) rotateY(540deg);
      }
      100% {
        transform-origin: right center;
        transform: translateX(280px) rotateY(540deg);
      }
    }

    .restart {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border: none;
      background: #fbfffb;
      font-weight: 900;
      color: rgb(36, 108, 129);
      border-radius: 12px;
      cursor: pointer;
    }

    .back-container {
      position: absolute;
      top: 580px;
      left: 0;
      width: 100%;
      text-align: center;
    }

    .back-button {
      width: 150px;
      cursor: pointer;
    }

      .decor {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 20; 
  pointer-events: none;
}

.decor img {
  width: 1550px;
  height: 720px;
}
  </style>
</head>

<body>

<section class="portfolio">

  <div class="card">
    <h3>RHINO</h3>
    <div class="container">
      <div class="flip-card">
        <div class="face front">
          <img src="./images/3d 1 .png">
        </div>
        <div class="face back">
          <img src="./images/3d 1 back.png">
        </div>
      </div>
    </div>
    <button class="restart">Replay Animation</button>
  </div>

  <div class="card">
    <h3>BLENDER</h3>
    <div class="container">
      <div class="flip-card">
        <div class="face front">
          <img src="./images/3d 2 Front (2).png">
        </div>
        <div class="face back">
          <img src="./images/3d 2 back.png">
        </div>
      </div>
    </div>
    <button class="restart">Replay Animation</button>
  </div>

  <div class="back-container">
    <a href="Portofolio.html">
      <img src="images/back button.png" class="back-button">
    </a>
  </div>

</section>
 <div class="decor">
    
        <img src="images/3d decor.png">
      
    </div>

<script>
  document.querySelectorAll('.restart').forEach(btn => {
    btn.addEventListener('click', e => {
      const flip = e.target.closest('.card').querySelector('.flip-card');
      flip.style.animation = 'none';
      flip.offsetHeight;
      flip.style.animation = 'flip 6s ease-in-out forwards';
    });
  });
</script>

</body>
</html>
